name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-backend:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/graph.py
          python -m py_compile backend/config.py
          python -m py_compile backend/nodes/planner.py
          python -m py_compile backend/nodes/search_embed.py
          python -m py_compile backend/nodes/synthesizer.py
          python -m py_compile backend/utils/embedder.py
          python -m py_compile backend/utils/scraper.py
          python -m py_compile backend/utils/chunker.py
          python -m py_compile backend/utils/chroma_client.py

  check-frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend
