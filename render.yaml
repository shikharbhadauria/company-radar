services:
  - type: web
    name: company-radar-backend
    runtime: python
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      playwright install chromium &&
      playwright install-deps chromium
    startCommand: uvicorn main:server --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false   # https://company-radar-searxng.fly.dev/search
      - key: ALLOWED_ORIGINS
        sync: false   # https://your-app.vercel.app
