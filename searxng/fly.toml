app = "company-radar-searxng"
primary_region = "bom"  # Mumbai — change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  SEARXNG_BASE_URL = "https://company-radar-searxng.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
