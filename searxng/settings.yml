use_default_settings: true

server:
  secret_key: "local-research-secret-key-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8080"

search:
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false

ui:
  static_use_hash: true
